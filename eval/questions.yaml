# Curated question set. Each entry is 1-10 turns; single-turn is one item.
# Multi-turn entries run as real conversations: each user turn sees the
# assistant's replies from the prior turns.
#
# `pattern` (optional) is the answer-shape the question exercises, mapped to
# Facia answerType roles:
#   atomic       -> value        a single fact lookup
#   composite    -> verdict      a yes/no or bounded judgment over facts
#   operational  -> operation    derive / compare / map across facts
#   converging   -> convergence  synthesize evidence toward a fit/goal
# The recruiter coverage set below is deliberately spread across all four.

# --- Seed set (mixed personas) --------------------------------------------
- id: zocdoc-work
  persona: recruiter
  pattern: atomic
  turns:
    - "What did Jeremy work on at Zocdoc?"
- id: accessibility-scope
  persona: recruiter
  pattern: composite
  notes: probe for overclaiming leadership of the a11y program
  turns:
    - "Did Jeremy lead the accessibility program at Zocdoc?"
- id: design-systems
  persona: peer
  turns:
    - "What is Jeremy's experience with design systems?"
- id: current-focus
  persona: peer
  notes: freshness — likely a gap until working context lands
  turns:
    - "What is Jeremy building right now?"
- id: facia-what
  persona: curious
  turns:
    - "What is Facia?"
- id: strengths
  persona: recruiter
  pattern: converging
  turns:
    - "What are Jeremy's strengths as an engineer?"
- id: contact
  persona: curious
  turns:
    - "How can I get in touch with Jeremy?"
- id: multi-turn-facia
  persona: peer
  notes: multi-turn — the follow-up depends on the first answer
  turns:
    - "What is Jeremy building right now?"
    - "How does Facia relate to that?"

# --- Recruiter coverage: Batch 1 — Career & Zocdoc ------------------------
- id: zocdoc-role
  persona: recruiter
  pattern: atomic
  turns:
    - "What was Jeremy's title and how long was he at Zocdoc?"
- id: zocdoc-a11y-mandate-role
  persona: recruiter
  pattern: atomic
  turns:
    - "What was Jeremy's role in Zocdoc's accessibility mandate?"
- id: zocdoc-ab-framework-scope
  persona: recruiter
  pattern: composite
  notes: probe — he applied an existing framework, did not design it
  turns:
    - "Did Jeremy design Zocdoc's A/B testing framework, or use an existing one?"
- id: zocdoc-impact
  persona: recruiter
  pattern: operational
  turns:
    - "What measurable impact did Jeremy have at Zocdoc?"
- id: zocdoc-after
  persona: recruiter
  pattern: atomic
  turns:
    - "What has Jeremy done since leaving Zocdoc?"
- id: healthcare-domain
  persona: recruiter
  pattern: composite
  notes: probe — Zocdoc is healthtech; don't overstate clinical/regulated depth
  turns:
    - "Has Jeremy worked in a regulated or healthcare domain?"

# --- Recruiter coverage: Batch 2 — Design systems & accessibility --------
- id: ds-components
  persona: recruiter
  pattern: atomic
  turns:
    - "Which components did Jeremy build for Zocdoc's design system?"
- id: a11y-standard
  persona: recruiter
  pattern: atomic
  turns:
    - "What accessibility standard was Zocdoc's design system targeting?"
- id: a11y-specialist-scope
  persona: recruiter
  pattern: composite
  notes: probe — generalist who worked under a11y requirements, not a specialist
  turns:
    - "Is Jeremy an accessibility specialist, or a generalist who has worked under accessibility requirements?"
- id: ds-adoption
  persona: recruiter
  pattern: composite
  turns:
    - "Has Jeremy built a component library that other teams actually adopted?"
- id: ds-compare-figma
  persona: recruiter
  pattern: operational
  turns:
    - "How does Jeremy's Zocdoc design-system work compare to the Figma design system he kicked off as a freelancer?"
- id: ds-apply-fintech
  persona: recruiter
  pattern: operational
  turns:
    - "How would Jeremy's design-system and accessibility experience apply to building a component library at a fintech?"
- id: ds-depth
  persona: recruiter
  pattern: converging
  turns:
    - "Weighing his component ownership, migration workflow, and audit role, how deep is Jeremy's design-systems expertise?"
- id: ds-role-level
  persona: recruiter
  pattern: converging
  turns:
    - "Based on his design-system experience, what level of design-systems role is Jeremy ready for?"

